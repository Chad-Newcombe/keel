<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keel">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="vendor/supabase.js"></script>
<title>Keel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a ship's log. Sticky header with the day, content in sections, tab bar fixed to the bottom.
   Theme: committed to one dark look. Near-black ground, bone text, brass as the single accent. */
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --surface:#141414; --sunk:#1D1D1C; --ink:#EDEAE4; --muted:#9C978E; --line:#272726; --field:#6E6C67;
  --accent:#C9A45C; --accent-ink:#0A0A0A; --accent-soft:#2A2417;
  --plum:#C9A45C; --plum-soft:#2A2417;
  --body:#D3CCBC; --body-soft:#25231F;
  --slate:#8E99A6; --slate-soft:#1C2026; --grey-soft:#1F1F1E;
  --good:#8DB596; --good-soft:#17241B; --warn:#E3AB4E; --warn-soft:#2B2213; --bad:#E58A77; --bad-soft:#2D1815;
  --f-display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 calc(104px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.85rem;line-height:1.15}
h2{font-size:1.15rem;line-height:1.3}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px))!important;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.daytag{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-align:right}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .row{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;min-height:56px;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.75rem;color:var(--muted);font-weight:500;position:relative;transition:background-color .12s}
.tab:active{background:var(--sunk)}
.tab[aria-current="page"]{font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{color:var(--accent)}

section.view{display:flex;flex-direction:column;gap:22px}
.block{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* hero: the one thing */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dom,var(--accent))}
.hero .why{color:var(--muted);max-width:60ch}
.hero .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

.btn{border:1px solid var(--field);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:.9rem;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .12s,border-color .12s,opacity .12s}
.btn:active{opacity:.7}
.btn.sm{padding:8px 12px;font-size:.875rem}
.btn svg{width:18px;height:18px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

/* timeline */
.tl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tl li{display:grid;grid-template-columns:64px 1fr auto;grid-template-areas:"t body st";gap:8px 12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.tl li>.t{grid-area:t}.tl li>.body{grid-area:body}.tl li>.st{grid-area:st}
@media (max-width:520px){.tl li{grid-template-columns:56px 1fr;grid-template-areas:"t body" ". st"}.tl li>.st{justify-content:flex-start}.tl li>.st:empty{display:none}}
.tl li:first-child{border-top:0}
.tl .t{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.tl .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.tl .title{font-weight:500}
.tl li.done .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.tl li.fixed{background:var(--sunk)}
.tl .st{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.75rem;font-family:var(--f-mono);letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
.chip.marriage{background:var(--plum-soft);color:var(--plum)}
.chip.body{background:var(--body-soft);color:var(--body)}
.chip.recovery{background:var(--slate-soft);color:var(--slate)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.primary{background:var(--ink);color:var(--bg)}
.note{font-size:.85rem;color:var(--muted)}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.outcome{margin-top:6px;font-size:.85rem;padding:8px 10px;border-radius:8px;background:var(--sunk);display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* alerts */
.alert{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.alert.warn{background:var(--warn-soft);color:var(--ink)}
.alert.warn b{color:var(--warn)}
.alert.info{background:var(--sunk)}
.alert.bad{background:var(--bad-soft)}

/* log grid */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=number],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--field);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{width:96px}
textarea{width:100%;min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.big{font-family:var(--f-display);font-size:2.1rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:8px;border:1px solid var(--field);background:var(--bg);font-size:1.1rem}
.seg{display:flex;border:1px solid var(--field);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);min-height:44px;padding:0;font-family:var(--f-mono);font-size:.95rem;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ck{display:grid;grid-template-columns:70px 1fr;gap:8px 10px;align-items:center}
.ck span{font-size:.85rem;color:var(--muted)}
.handled{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.handled li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.handled li button{background:none;border:0;color:var(--muted);font-size:.875rem;min-height:44px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}

/* week */
.weeknav{display:flex;align-items:center;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day.today{border-color:var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.dayhead h3{font-size:.95rem}
.slot{display:grid;grid-template-columns:96px 1fr auto;gap:10px;min-height:48px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.slot:first-of-type{border-top:0}
.slot .t{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .nm{min-width:0}
.slot.conf{background:var(--bad-soft)}
.sti{width:20px;height:20px;flex:none;color:var(--line)}
.sti.done{color:var(--good)} .sti.missed{color:var(--bad)} .sti.moved{color:var(--warn)}
button.slot:active{background:var(--sunk)}
.dot.done{background:var(--good)} .dot.missed{background:var(--bad)} .dot.moved{background:var(--warn)}
.load{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.load .bar{width:60px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.load .bar i{display:block;height:100%;background:var(--accent)}
.load.over .bar i{background:var(--warn)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .goal{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.5;fill:none}
.chart .avg{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .area{fill:var(--accent-soft);stroke:none}
.chart .pt{fill:var(--muted)}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .barr{fill:var(--plum)}
.chart .bar2{fill:var(--body)}
.chart .lbl{fill:var(--ink);font-family:var(--f-mono);font-size:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}

/* coach */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai.err{border-color:var(--bad)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;flex:1}
.quick{display:flex;gap:6px;flex-wrap:wrap}

/* baseline */
.prose{display:flex;flex-direction:column;gap:10px;max-width:65ch}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.85rem}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;border-top:0;background:var(--sunk)}
.prio{counter-reset:p;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prio li{counter-increment:p;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 48px;position:relative}
.prio li::before{content:counter(p);position:absolute;left:14px;top:12px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--accent)}
.journal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.journal .jq{font-size:1.3rem;line-height:1.3;max-width:42ch}
.feel{display:flex;gap:6px;flex-wrap:wrap}
.feel{gap:8px!important}
.feel button{border:1px solid var(--field);background:var(--bg);border-radius:999px;min-height:44px;padding:0 14px;font-size:.9rem;transition:background-color .12s}
.feel button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.askher{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.askher p{font-family:var(--f-display);font-size:1.08rem;line-height:1.35;color:var(--plum);max-width:48ch}
.jtext{white-space:pre-wrap;color:var(--muted);max-width:65ch}
.past{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.past div{display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--line);padding-left:10px}
.status{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.88rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:14px} }
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:.8rem;color:var(--muted)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick{gap:8px!important}
.daypick button{border:1px solid var(--field);background:var(--bg);border-radius:8px;min-width:48px;min-height:44px;padding:0 8px;font-size:.875rem}
.daypick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
.skel{display:flex;flex-direction:column;gap:12px;padding-block:8px}
.skel i{display:block;height:88px;border-radius:var(--r);background:var(--sunk)}
.skel i:first-child{height:150px}
@media (prefers-reduced-motion:no-preference){.skel i{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.err{color:var(--bad);font-size:.875rem;margin:0}
.err:empty{display:none}
.ck .err{grid-column:1/-1}
.hero-title{font-size:1.85rem;line-height:1.15}
html{scroll-padding-top:80px;scroll-padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button,a,input,select,textarea,summary{touch-action:manipulation}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
input[type=text],input[type=number],input[type=time],select,textarea{font-size:16px;min-height:44px}
input[aria-invalid="true"]{border-color:var(--bad)}
/* today v2 */
.today{gap:16px}
.voyage{display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.vw{font-size:.875rem}
.vbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--accent);border-radius:3px;min-width:6px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hero-txt{min-width:0;display:flex;flex-direction:column;gap:6px}
.ring{width:60px;height:60px;flex:none}
.ring-bg{fill:none;stroke:var(--sunk);stroke-width:6}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round}
.ring-t{font-family:var(--f-mono);font-size:13px;fill:var(--ink)}
.jrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:64px;transition:background-color .12s}
.jrow.lead{border-color:var(--plum)}
.jr-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.jr-q{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jr-ask{font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jr-go{flex:none;background:var(--plum);color:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;font-size:.9rem}
.chev{width:20px;height:20px;flex:none;color:var(--muted)}
.jrow:active,.tile:active,.t-main:active,.plan .row:active{background:var(--sunk)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:84px;min-width:0;transition:background-color .12s}
.tile.split{flex-direction:row;padding:0;gap:0;overflow:hidden}
.t-main{flex:1;min-width:0;background:none;border:0;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.t-plus{flex:none;width:48px;border:0;border-left:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-size:1.4rem;font-weight:600}
.t-plus:active{opacity:.7}
.t-l{font-size:.75rem;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.t-v{font-family:var(--f-display);font-size:1.5rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.t-v.sm{font-size:1rem;padding-block:4px}
.t-s{font-size:.8rem;color:var(--muted)}
.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plan li{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.ckb{flex:none;width:52px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0}
.ckb svg{width:26px;height:26px;padding:3px;border-radius:50%;border:2px solid var(--field);color:transparent;box-sizing:border-box;transition:background-color .15s,border-color .15s}
.ckb[aria-pressed="true"] svg{background:var(--good);border-color:var(--good);color:var(--surface)}
.ckb:disabled{opacity:.4}
.ckb.lock svg{border:0;color:var(--muted);width:20px;height:20px;padding:0}

function resolveMiss(ds, b){

  if (b.tier === "maintenance" || b.tier === "recovery") return { kind:"drop", text:"Not rescheduled. It comes back on its own next time." };
  if (b.moved) return { kind:"drop", text:"Already moved once this week. Letting it go so nothing piles up." };
  for (let i=1;i<=2;i++){
    const nd = addDays(d0,i);
    if (!b.moved && b.days && b.days.includes(nd.getDay())) return { kind:"drop", text:`Not rescheduled. It's back ${i===1?"tomorrow":fmtD(nd)}. Pick it up then.` };
  }
  if (b.domain === "body") {
    for (let i=1;i<=2;i++){
      const nd = ymd(addDays(d0,i));
      const nxt = blocksFor(nd).find(x => x.domain === "body");
      if (nxt) return { kind:"drop", text:`Not rescheduled. Next training is ${fmtD(addDays(d0,i))} at ${fmtT(nxt.start)}. Two sessions back to back helps less than recovering.` };
    }
  }
  const dur = mins(b.end) - mins(b.start);
  const weekEnd = addDays(mondayOf(d0), 6);
  for (let d = addDays(d0,1); d <= weekEnd; d = addDays(d,1)) {
    const nd = ymd(d);
    const winS = isShiftDay(d) ? mins(S.profile.shiftEnd) + 30 : 8*60;
    const winE = isShiftDay(d) ? Math.min(20*60+30, mins(S.profile.shiftEnd) + 150) : 20*60;
    const busy = blocksFor(nd).map(x => [mins(x.start)-15, mins(x.end)+15]);
    for (let t = winS; t + dur <= winE; t += 15) {
      if (!busy.some(([a,z]) => t < z && a < t+dur)) {
        if (plannedMinutes(nd) + dur > discretionaryCap(nd)) break;
        return { kind:"move", date:nd, start:toT(t), end:toT(t+dur), text:`Open slot: ${fmtD(d)} at ${fmtT(toT(t))}.` };
      }

}

      let h = 0, mm = 0, found = false;
      if ((m = Lc.match(/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours)\b/))) { h = +m[1]; found = true; }
      if ((m = Lc.match(/(\d+(?:\.\d+)?)\s*(m|min|mins|minute|minutes)\b/))) { mm = +m[1]; found = true; }
      if (!found && (m = Lc.match(/([\d,]+(?:\.\d+)?)\s*(s|sec|secs|second|seconds)\b/))) { mm = +m[1].replace(/,/g,"")/60; found = true; }

  let seen = null; try { seen = localStorage.getItem("keel-rank"); } catch(e) {}
  if (seen === null) { try { localStorage.setItem("keel-rank", String(G.ri)); } catch(e) {} }
  else if (G.ri > Number(seen) && !S.panel && !sheetState) {
    try { localStorage.setItem("keel-rank", String(G.ri)); } catch(e) {}
    try { navigator.vibrate && navigator.vibrate([12,60,12]); } catch(e) {}
    openPanel({ type:"rankup", rank:G.rank });
  }
}
function render(){

  if (ae && ($("#app").contains(ae) || $("#layer").contains(ae)) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== "button") { pendingRender = true; return; }
  pendingRender = false;

  $("#daytag").innerHTML = S.profile ? `${esc(fmtD(now))}<br>${isShiftDay(now)?"Shift day":"Day off"}` : "";
  $("#banner").innerHTML = Store.mode === "offline" ? `<div class="banner">Offline. Everything you log is kept on this phone and syncs when you're back online.</div>` : "";
  if (Store.mode === "auth") { $("#daytag").innerHTML = ""; $("#app").innerHTML = viewAuth(); document.querySelector(".tabs").hidden = true; return; }
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.v === S.view ? "page" : "false"));
  if (Store.mode === "pending" || !S.loaded.profile || !S.loaded.plan) { $("#app").innerHTML = `<div class="skel" role="status" aria-label="Loading your week"><i></i><i></i><i></i></div>`; return; }
  if (!S.profile) { $("#app").innerHTML = viewOnboard(); document.querySelector(".tabs").hidden = true; return; }
  document.querySelector(".tabs").hidden = false;
  if (!S.plan) { Store.set("os/plan", starterPlan(S.profile)); }
  const v = { today:viewToday, week:viewWeek, progress:viewProgress, baseline:viewBaseline }[S.view] || viewToday;
  S.G = gameState();
  $("#app").innerHTML = v();

  if (S.panel && !sheetState) drawSheet();
}

function chip(cls, txt){ return `<span class="chip ${cls}">${esc(txt)}</span>`; }

function ring(done, total){
  const r = 23, c = 2*Math.PI*r, f = total ? Math.min(1, done/total) : 0;
  return `<svg class="ring" viewBox="0 0 60 60" role="img" aria-label="${done} of ${total} done today">
    <circle cx="30" cy="30" r="${r}" class="ring-bg"/>
    <circle cx="30" cy="30" r="${r}" class="ring-fg" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 30 30)"/>
    <text x="30" y="34" text-anchor="middle" class="ring-t">${done}/${total}</text></svg>`;
}

function viewToday(){
  const now = new Date(), ds = ymd(now), dd = dayDoc(ds), p = S.profile;

  const warns = patternWarnings(now);
  { const rb = rhrBaseline(ds), rt = dd.rhr; if (rb != null && typeof rt === "number" && rt >= rb + 5) warns.unshift(`<b>Resting heart rate is ${rt}</b>, about ${Math.round(rt-rb)} above your usual. You may be under-recovered or getting sick. Go lighter today and protect sleep tonight.`); }
  const ck = dd.checkin || {};
  if (typeof ck.sleep === "number" && ck.sleep < 6 && isShiftDay(now)) warns.unshift(`<b>${ck.sleep}h of sleep.</b> Cut today's lift to 2 working sets or skip it. The 15 minutes with her still matters.`);
  Object.keys(conf).filter(id=>id!=="shift").forEach(id => { const b = list.find(x=>x.id===id); if (b) warns.push(`<b>${esc(b.title)}</b> overlaps ${esc(conf[id].join(", "))}. Fix it in Week.`); });

  const doneN = doable.filter(b => statusOf(ds,b.id) === "done").length;
  const ws = weekStats(mondayOf(now));

  // 90-day line
  const dayN = Math.max(1, Math.min(90, Math.round((parseYmd(ds) - parseYmd(p.startDate))/864e5) + 1));
  const ser = weightSeries(), latest = ser.length ? ser[ser.length-1].w : null;
  const G = S.G || gameState();
  const voyage = `<div class="voyage" id="voyage">
    <div class="vrow"><span class="rank"><span class="rk-medal">${MEDAL}</span><b>${esc(G.rank)}</b><span class="muted num">${fmtN(G.total)} nm</span></span><span class="eyebrow">Day ${G.dayN} of 90</span></div>
    <div class="vbar" role="progressbar" aria-label="Progress to ${G.next?esc(G.next[0]):"top rank"}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(G.pct)}"><i style="width:${G.pct.toFixed(1)}%"></i></div>
    <div class="vrow"><span class="note num">+${G.todayPts} nm today</span><span class="note num">${G.next?`${fmtN(G.next[1]-G.total)} nm to ${esc(G.next[0])}`:"Top rank"}</span></div>
  </div>`;

  // hero
  let hero;
  if (pr) {
    const st = statusOf(ds, pr.id);
    hero = `<div class="hero" style="--dom:${DOM_VAR[pr.domain]}">
      <div class="hero-top"><div class="hero-txt"><p class="eyebrow">The one thing today</p>

        <p class="why">${esc(fmtT(pr.start))} to ${esc(fmtT(pr.end))}</p></div>${ring(doneN, doable.length)}</div>

    : `<button class="jrow ${jFirst?"lead":""}" data-act="panel" data-p="journal"><span class="jr-txt"><span class="eyebrow">Morning journal</span><span class="jr-q">${esc(pq.s)}</span></span><span class="jr-go">Write</span></button>`;

  // quick log tiles
  const ckBits = [ck.mood?`mood ${ck.mood}`:"", ck.sleep!=null?`${ck.sleep}h sleep`:""].filter(Boolean);
  const tiles = `<div class="tiles">
    <button class="tile" data-act="panel" data-p="weight"><span class="t-l">Weight</span><span class="t-v num">${dd.weight ?? "–"}</span><span class="t-s">${ws.avgW!=null?`avg ${round1(ws.avgW)}`:"tap to log"}</span></button>

  // plan list

  }).join("");

  return `<section class="view today">
    <h1 class="sr-only">Today, ${esc(fmtD(now))}</h1>
    ${voyage}
    ${jFirst ? jrow : ""}
    ${hero}
    ${!jFirst ? jrow : ""}
    ${tiles}
    ${warns.length ? `<div class="alert warn"><span>${warns[0]}${warns.length>1?` <span class="muted">(+${warns.length-1} more in Week)</span>`:""}</span></div>` : ""}
    <div class="block"><div class="sechead"><h2>Today's plan</h2><span class="inrow"><span class="note num">${doneN} of ${doable.length} done</span><button class="btn sm" data-act="panel" data-p="workouts">From Watch</button></span></div>
      <ul class="plan">${rows || `<li><span></span><div class="row"><span class="muted">Nothing scheduled.</span></div></li>`}</ul></div>
  </section>`;
}

function viewWeek(){
  const now = new Date(), mon = addDays(mondayOf(now), 7*S.weekOffset), todayS = ymd(now);
  const days = [...Array(7)].map((_,i)=>addDays(mon,i));
  const dss = days.map(ymd);
  if (!S.wday || !dss.includes(S.wday)) S.wday = dss.includes(todayS) ? todayS : dss[0];
  const label = S.weekOffset===0 ? "This week" : S.weekOffset===1 ? "Next week" : S.weekOffset===-1 ? "Last week" : `Week of ${fmtD(mon)}`;
  const T0 = 4*60, T1 = 22*60, SPAN = T1 - T0;
  const pos = m => Math.max(0, Math.min(100, (m - T0) / SPAN * 100));
  const ticks = [4,8,12,16,20].map(h => `<span style="left:${pos(h*60).toFixed(2)}%">${h===12?"12p":h<12?h+"a":(h-12)+"p"}</span>`).join("");
  const nowM = now.getHours()*60 + now.getMinutes();
  const rows = days.map(d => {
    const ds = ymd(d), list = blocksFor(ds), conf = conflictsIn(list), over = plannedMinutes(ds) > discretionaryCap(ds);
    const segs = list.map(b => {
      const s = mins(b.start), e = mins(b.end), st = statusOf(ds, b.id);
      const w = Math.max(1.4, pos(e) - pos(s));
      return `<i class="bk ${b.fixed?"work":b.domain} ${st||""} ${conf[b.id]&&!b.fixed?"conf":""}" style="left:${pos(s).toFixed(2)}%;width:${w.toFixed(2)}%"></i>`;
    }).join("");
    const nowLine = ds === todayS && nowM >= T0 && nowM <= T1 ? `<b class="nowline" style="left:${pos(nowM).toFixed(2)}%"></b>` : "";
    const flag = Object.keys(conf).some(id=>id!=="shift") || over;
    return `<button class="srow ${ds===todayS?"is-today":""}" data-act="wday" data-ds="${ds}" aria-pressed="${ds===S.wday}" aria-label="${esc(DOWL[d.getDay()])} ${d.getDate()}, ${list.length} blocks${flag?", needs attention":""}">
      <span class="sd"><span class="sd-w">${DOW[d.getDay()]}</span><span class="sd-n num">${d.getDate()}</span></span>
      <span class="sbar">${segs}${nowLine}</span>${flag?`<span class="sflag" aria-hidden="true">!</span>`:`<span class="sflag"></span>`}</button>`;
  }).join("");

  const ds = S.wday, d = parseYmd(ds), list = blocksFor(ds), conf = conflictsIn(list);
  const pm = plannedMinutes(ds), cap = discretionaryCap(ds), over = pm > cap;
  const slots = list.map(b => {
    const st = statusOf(ds, b.id);
    const inner = `<span class="t">${esc(fmtT(b.start))}–${esc(fmtT(b.end))}</span><span class="nm"><i class="dd ${b.fixed?"work":b.domain}"></i>${esc(b.title)}${conf[b.id]&&!b.fixed?` <span class="chip bad">Overlap</span>`:""}</span>${b.fixed?`<span class="sti lockic">${LOCK}</span>`:statusIcon(st)}`;
    return b.fixed || b.moved ? `<div class="slot">${inner}</div>` : `<button class="slot" data-act="edit" data-id="${esc(b.id)}" aria-label="Edit ${esc(b.title)}">${inner}</button>`;
  }).join("");
  const navBtn = (n, lbl, path) => `<button class="btn sm" data-act="wk" data-n="${n}" aria-label="${lbl}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="${path}"/></svg></button>`;
  return `<section class="view">
    <div class="sechead"><h1>${label}</h1><div class="weeknav">${navBtn(-1,"Previous week","M15 6l-6 6 6 6")}<button class="btn sm" data-act="wk" data-n="0">Now</button>${navBtn(1,"Next week","M9 6l6 6-6 6")}</div></div>
    <div class="strip">
      <div class="saxis"><span class="sd"></span><span class="sticks">${ticks}</span><span class="sflag"></span></div>
      ${rows}
      <div class="legend"><span><i class="dd marriage"></i>Marriage</span><span><i class="dd body"></i>Body</span><span><i class="dd recovery"></i>Recovery</span><span><i class="dd work"></i>Shift</span></div>
    </div>
    <div class="day">
      <div class="dayhead"><h2>${esc(DOWL[d.getDay()])}, ${esc(MON[d.getMonth()])} ${d.getDate()}${isShiftDay(d)?` <span class="chip">Shift</span>`:""}</h2>
        <span class="load ${over?"over":""}">${pm}/${cap} min <span class="bar"><i style="width:${Math.min(100,Math.round(pm/cap*100))}%"></i></span></span></div>
      ${over?`<div class="alert warn" style="margin:12px"><span><b>Too much for one day.</b> ${pm} minutes planned outside fixed commitments; about ${cap} fits. Move or drop something.</span></div>`:""}
      ${slots || `<div class="slot"><span></span><span class="muted">Open day</span><span></span></div>`}
    </div>
    <div class="inrow"><button class="btn primary" data-act="edit" data-id="">Add a block</button><span class="note">Changes repeat every week. Your shift never moves.</span></div>
  </section>`;
}

function chartWeight(){
  const ser = weightSeries(); const p = S.profile;
  if (ser.length < 2) return `<div class="alert info">Log your morning weight on Today. The trend line shows up after two entries.</div>`;
  const W=640, H=220, L=40, R=16, T=14, B=26;
  const start = parseYmd(ser[0].ds), end = parseYmd(ser[ser.length-1].ds);
  const span = Math.max(1, Math.round((end-start)/864e5));
  const ma = ser.map((s,i) => { const d0 = parseYmd(s.ds); const win = ser.filter(x => { const dx=(d0-parseYmd(x.ds))/864e5; return dx>=0 && dx<7; }); return { ds:s.ds, w:avg(win.map(x=>x.w)) }; });
  const all = ser.map(s=>s.w).concat([p.goalWeight]);
  let lo = Math.floor(Math.min(...all)-1), hi = Math.ceil(Math.max(...all)+1);
  const x = ds => L + (W-L-R) * (Math.round((parseYmd(ds)-start)/864e5)/span);
  const y = w => T + (H-T-B) * (1 - (w-lo)/(hi-lo));
  const step = hi-lo > 12 ? 4 : 2; let grid = "";
  for (let v = Math.ceil(lo/step)*step; v <= hi; v += step) grid += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const line = ma.map((m,i)=>`${i?"L":"M"}${x(m.ds).toFixed(1)},${y(m.w).toFixed(1)}`).join("");
  const area = `${line}L${x(ma[ma.length-1].ds).toFixed(1)},${H-B}L${x(ma[0].ds).toFixed(1)},${H-B}Z`;
  const last = ma[ma.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend, 7 day average">
    ${grid}
    <line class="goal" x1="${L}" x2="${W-R}" y1="${y(p.goalWeight)}" y2="${y(p.goalWeight)}"/><text class="axis" x="${W-R}" y="${y(p.goalWeight)-5}" text-anchor="end" style="fill:var(--muted)">goal ${p.goalWeight}</text>
    <path class="area" d="${area}" opacity=".6"/>
    ${ser.map(s=>`<circle class="pt" cx="${x(s.ds).toFixed(1)}" cy="${y(s.w).toFixed(1)}" r="2.2"/>`).join("")}
    <path class="avg" d="${line}"/>
    <circle class="end" cx="${x(last.ds).toFixed(1)}" cy="${y(last.w).toFixed(1)}" r="5"/>
    <text class="axis" x="${L}" y="${H-8}">${esc(fmtD(start))}</text><text class="axis" x="${W-R}" y="${H-8}" text-anchor="end">${esc(fmtD(end))}</text>
  </svg>`;
}
function chartHandled(){
  const mon = mondayOf(new Date()); const weeks = [...Array(8)].map((_,i)=>addDays(mon,-7*(7-i)));
  const data = weeks.map(w => { const s = weekStats(w); return { w, h:s.handled, t:s.toward }; });
  const mx = Math.max(4, ...data.map(d=>Math.max(d.h,d.t)));
  const W=640,H=180,L=28,R=10,T=12,B=26, bw=(W-L-R)/8;
  const y = v => T+(H-T-B)*(1-v/mx);
  let grid=""; for (let v=0; v<=mx; v+=Math.max(1,Math.ceil(mx/4))) grid += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const bars = data.map((d,i)=>{ const x0=L+i*bw+bw*.18, w=bw*.3; return `<rect class="barr" x="${x0}" y="${y(d.h)}" width="${w}" height="${Math.max(0,H-B-y(d.h))}" rx="2"/><rect class="bar2" x="${x0+w+2}" y="${y(d.t)}" width="${w}" height="${Math.max(0,H-B-y(d.t))}" rx="2" opacity=".75"/><text class="axis" x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${MON[d.w.getMonth()]} ${d.w.getDate()}</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Handled and turned toward per week">${grid}${bars}</svg>
  <div class="chips">${chip("marriage","Handled for her")}${chip("body","Turned toward")}</div>`;
}
function corrNote(){
  const rows = Object.values(S.days).filter(d => d.checkin && typeof d.checkin.mood === "number");
  const trained = rows.filter(d => Object.entries(d.status||{}).some(([id,st]) => st==="done" && /lift|run/.test(id)));
  const rest = rows.filter(d => !trained.includes(d));
  if (trained.length < 5 || rest.length < 5) return `<p class="note">After 5 logged days with training and 5 without, Keel compares your mood on each. Not enough data yet.</p>`;
  const a = round1(avg(trained.map(d=>d.checkin.mood))), b = round1(avg(rest.map(d=>d.checkin.mood)));
  return `<p>Mood averages <span class="num">${a}</span> on days you trained (${trained.length} days) and <span class="num">${b}</span> on days you didn't (${rest.length} days).</p><p class="note">This is a pattern, not proof. Sleep, shifts and other things move both.</p>`;
}

let chatCtl = null;
function coachContext(){
  const p = S.profile, now = new Date(), lines = [];
  lines.push(`Today: ${fmtD(now)} (${isShiftDay(now)?"shift day":"day off"}).`);
  lines.push(`Person: ${p.name}, ${Math.floor(p.heightIn/12)}'${p.heightIn%12}", started ${p.startDate} at ${p.startWeight} lb, ${p.startBf}% body fat. Goal ${p.goalWeight} lb at ${p.goalBf}%.`);
  lines.push(`Work: shifts ${p.shiftDays.map(d=>DOW[d]).join(", ")} ${p.shiftStart}-${p.shiftEnd}.`);
  lines.push(`Marriage: ${p.marriage.years} years. ${p.marriage.self} Wife wants him ${p.marriage.herAsk}. ${p.marriage.note}`);
  lines.push(`Keel rank: ${S.G?S.G.rank:""}, ${S.G?fmtN(S.G.total):0} nautical miles (points for logged actions; motivation only).`);
  lines.push(`90-day priorities: 1) be steady at home: EFT couples consult, daily 15 min phone-away time, own household areas fully; metric = things handled for her per week. 2) recomp: lift + run, ~190 g protein, lose 0.5-0.75 lb/week; metric = weekly average weight. 3) protect sleep before shifts.`);
  lines.push(`Weekly plan:`);
  ((S.plan&&S.plan.blocks)||[]).forEach(b => lines.push(`- ${b.title} (${DOMAIN[b.domain]}, ${TIER[b.tier]}): ${b.days.map(d=>DOW[d]).join("/")} ${b.start}-${b.end}`));
  lines.push(`Last 14 days of logs (blank days mean nothing logged, not necessarily missed):`);
  for (let i=13;i>=0;i--){
    const ds = ymd(addDays(now,-i)), d = S.days[ds]; if (!d) continue;
    const st = Object.entries(d.status||{}).map(([k,v])=>`${k}:${v}${(d.reasons||{})[k]?"("+d.reasons[k]+")":""}`).join(", ");
    const ck = d.checkin||{};
    lines.push(`${ds}: ${[typeof d.weight==="number"?`weight ${d.weight}`:"", st?`blocks ${st}`:"", (d.handled||[]).length?`handled: ${d.handled.map(h=>h.text).join("; ")}`:"", d.toward?`turned toward ${d.toward}`:"", ck.mood?`mood ${ck.mood}/5`:"", ck.stress?`stress ${ck.stress}/5`:"", ck.energy?`energy ${ck.energy}/5`:"", ck.sleep!=null?`slept ${ck.sleep}h`:"", (d.workouts||[]).length?`workouts: ${d.workouts.map(w=>w.type+" "+wkText(w)).join("; ")}`:"", typeof d.rhr==="number"?`resting HR ${d.rhr}`:"", d.journal&&(d.journal.text||d.journal.feeling)?`journal (feeling: ${d.journal.feeling||"none named"}; prompt: ${d.journal.prompt||""}): ${String(d.journal.text||"").slice(0,500)}`:""].filter(Boolean).join(" | ")}`);
  }
  const wk = Object.keys(S.reviews).sort().pop();
  if (wk) { const r = S.reviews[wk]; lines.push(`Latest weekly review (${wk}): ${["improved","worse","worked","waste","wrong","change"].filter(k=>r[k]).map(k=>`${k}: ${r[k]}`).join(" | ")}`); }
  return lines.join("\n");
}
const RULES = `You are Keel's coach for one person, Will. You help him decide how to use his time to improve his marriage, his body and his sleep.
Rules:
- Use only the data below. If something isn't in it, say you don't have it. Never claim to have seen data you weren't given.
- Separate what the logs show from your hypotheses. Don't claim causes from simple correlations.
- Be direct and decisive: give one recommendation, not a menu. Keep plans to a few steps.
- Keep it short and readable on a phone. Plain text, short paragraphs or a few dashes for lists. No markdown headers or bold.
- Never use em dashes.
- You are not a therapist or doctor. For medical issues or a relationship crisis, point him to a professional.

DATA:
`;
async function ask(q){
  q = String(q||"").trim(); if (!q || S.chatBusy) return;
  const sample = window.claude && claude.use ? await claude.use("sample").catch(()=>null) : null;
  S.chat.push({ role:"user", text:q });
  if (!sample) { S.chat.push({ role:"assistant", text:"The coach isn't available here. Open Keel from your Claude app to use it.", err:true }); render(); return; }
  const ai = { role:"assistant", text:"" }; S.chat.push(ai); S.chatBusy = true; render();
  const idx = S.chat.length-1;
  const turns = [{ role:"user", content: RULES + coachContext() }];
  S.chat.slice(0,-1).filter(m=>!m.err).slice(-12).forEach(m => turns.push({ role:m.role, content:m.text }));
  chatCtl = new AbortController();
  try {
    const r = await sample(turns, { cache:false, signal:chatCtl.signal, onText:({text}) => { ai.text = text; const el = document.getElementById("m-"+idx); if (el) el.textContent = text; } });
    ai.text = r.text; if (r.truncated) ai.text += "\n\n(Cut short. Ask for less at a time.)";
  } catch(e) {
    const copy = { not_granted:"Keel isn't allowed to use Claude in this view.", sampling_disabled:"Claude isn't available for this account.", rate_limited:"Too many requests right now. Try again in a bit.", session_expired:"Sign in to Claude again, then retry.", refused:"Claude didn't answer that one. Try asking another way." }[e && e.code];
    if (e && e.code === "cancelled") { ai.text = (e.text || "") + (e.text ? "\n\n(Stopped.)" : "Stopped."); }
    else { ai.text = (e && e.code!=="refused" && e.text ? e.text + "\n\n" : "") + (copy || "Something went wrong reaching Claude. Try again."); ai.err = true; }
  } finally { S.chatBusy = false; chatCtl = null; render(); }
}

  }
  if (kind === "chat") { const el = $("#chat-in"); const v = el.value; el.value = ""; el.blur(); ask(v); }
  if (kind === "review") { const wk = ymd(mondayOf(new Date())); const r = { weekStart:wk, savedAt:new Date().toISOString() }; ["improved","worse","worked","waste","wrong","change"].forEach(k => { r[k] = (document.getElementById("rv-"+k).value||"").trim(); }); document.activeElement && document.activeElement.blur(); Store.set("reviews/"+wk, r); toast("Review saved"); }
  if (kind === "profile") {
    const p = clone(S.profile); p.shiftStart = $("#p-ss").value || p.shiftStart; p.shiftEnd = $("#p-se").value || p.shiftEnd;
    p.shiftDays = [...f.querySelectorAll('[data-act="pday"][aria-pressed="true"]')].map(b=>Number(b.dataset.d));
    const gw = parseFloat($("#p-gw").value), gb = parseFloat($("#p-gb").value); if (gw>0) p.goalWeight = gw; if (gb>0) p.goalBf = gb;
    document.activeElement && document.activeElement.blur(); Store.set("os/profile", p); toast("Settings saved. Use Rebuild week if your shifts changed.");
  }
  if (kind === "block") {
    readSheet(); const b = sheetState; const w = $("#b-warn");
    if (!b.title) { w.textContent = "Give it a name."; return; }
    if (!b.days.length) { w.textContent = "Pick at least one day."; return; }
    if (mins(b.end) <= mins(b.start)) { w.textContent = "End has to be after start."; return; }
    const sh = S.profile; const hit = b.days.filter(d => sh.shiftDays.includes(d) && mins(b.start) < mins(sh.shiftEnd) && mins(sh.shiftStart) < mins(b.end));
    if (hit.length) { w.textContent = `That overlaps your shift on ${hit.map(d=>DOW[d]).join(", ")}. Pick a different time.`; return; }
    const plan = clone(S.plan) || { version:1, blocks:[] };
    if (!b.id) { b.id = "b-"+uid(); plan.blocks.push(b); } else plan.blocks = plan.blocks.map(x => x.id===b.id ? b : x);
    closeSheet(); Store.set("os/plan", plan); toast("Saved");
  }
});
function viewAuth(){
  if (!S.authMode) S.authMode = lsGet("keel-has-account", false) ? "in" : "setup";
  const setup = S.authMode === "setup";
  return `<section class="view ob auth">
    <div class="auth-mark">${KMARK}</div>
    <p class="q">${setup ? "Set up Keel" : "Sign in to Keel"}</p>
    <p class="muted">${setup ? "One time only. Use the setup code Claude gave you, and pick a password." : "Your plan, logs and journal are waiting."}</p>
    <form class="ob" data-form="auth">
      <label class="field"><span>Email</span><input type="email" id="a-email" autocomplete="username" inputmode="email" autocapitalize="off"></label>
      <label class="field"><span>${setup ? "New password" : "Password"}</span><input type="password" id="a-pass" autocomplete="${setup ? "new-password" : "current-password"}"></label>
      ${setup ? `<label class="field"><span>Setup code</span><input type="text" id="a-code" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX-XXXX"></label>` : ""}
      <p class="err" id="a-err" role="alert"></p>
      <button class="btn primary" type="submit">${setup ? "Create my account" : "Sign in"}</button>
      <button type="button" class="btn ghost" data-act="authmode">${setup ? "I already set up Keel" : "First time? Set up Keel"}</button>
    </form></section>`;
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
Store.init();
})();
</script>
